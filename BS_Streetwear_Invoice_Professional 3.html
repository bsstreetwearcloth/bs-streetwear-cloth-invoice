<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BS Streetwear Cloth - Pro</title>
<style>
:root{--bg:#f3f4f6;--card:#fff;--ink:#111;--muted:#6b7280;--line:#e5e7eb;--accent:#111}*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,sans-serif;background:var(--bg);color:var(--ink)}header{background:#111;color:white;padding:15px 18px;position:sticky;top:0;z-index:5;display:flex;justify-content:space-between;align-items:center}header b{font-size:18px}header small{display:block;color:#aaa;margin-top:3px}.wrap{max-width:1180px;margin:auto;padding:14px}.nav{display:flex;gap:7px;overflow:auto;margin-bottom:14px}.nav button{white-space:nowrap;border:1px solid var(--line);background:#fff;border-radius:10px;padding:10px 13px}.nav button.active,.primary{background:#111;color:#fff;border-color:#111}.card{background:#fff;border:1px solid var(--line);border-radius:15px;padding:15px;margin-bottom:13px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.stat strong{font-size:22px;display:block;margin-top:5px}.muted{color:var(--muted);font-size:12px}label{font-size:12px;color:#555;display:block;margin-bottom:5px}input,select,textarea{width:100%;padding:10px;border:1px solid #d8dce1;border-radius:9px;font:inherit}textarea{min-height:70px}.row{display:grid;grid-template-columns:2fr .7fr 1fr 1fr auto;gap:7px;align-items:end;margin-bottom:8px}.actions{display:flex;gap:7px;flex-wrap:wrap}.btn{border:0;border-radius:9px;padding:10px 13px;cursor:pointer}.danger{background:#b42318;color:#fff}.secondary{background:#eee;color:#222}table{width:100%;border-collapse:collapse}th,td{padding:9px;border-bottom:1px solid #eee;text-align:left;font-size:13px}th{background:#fafafa}.right{text-align:right}.total{font-size:21px;font-weight:700}.pill{display:inline-block;padding:4px 8px;border-radius:99px;background:#eee;font-size:11px}.hidden{display:none}.invoice-paper{max-width:800px;margin:auto;border:1px solid #ddd;padding:28px;background:white}.invoice-head{display:flex;justify-content:space-between;border-bottom:2px solid #111;padding-bottom:15px;margin-bottom:15px}.dangerText{color:#b42318}@media(max-width:760px){.grid{grid-template-columns:1fr 1fr}.grid2{grid-template-columns:1fr}.row{grid-template-columns:1fr 1fr}.row .wide{grid-column:1/-1}}@media(max-width:450px){.grid{grid-template-columns:1fr}.wrap{padding:9px}}@media print{header,.nav,.no-print{display:none!important}body{background:#fff}.wrap{padding:0}.card{border:0;box-shadow:none}}
</style></head><body>
<header><div><b>BS STREETWEAR CLOTH</b><small>Invoice • Produksi • Stok • Keuangan</small></div><span id="clock"></span></header>
<div class="wrap"><div class="nav no-print">
<button class="active" onclick="tab('dashboard',this)">Dashboard</button><button onclick="tab('orders',this)">Pesanan</button><button onclick="tab('invoice',this)">Invoice</button><button onclick="tab('stock',this)">Stok</button><button onclick="tab('purchase',this)">Belanja</button><button onclick="tab('expense',this)">Pengeluaran</button><button onclick="tab('reports',this)">Laporan</button><button onclick="tab('settings',this)">Pengaturan</button></div>

<section id="dashboard"><div class="grid">
<div class="card stat"><div class="muted">Omzet</div><strong id="sOmzet">Rp0</strong></div><div class="card stat"><div class="muted">Terbayar</div><strong id="sPaid">Rp0</strong></div><div class="card stat"><div class="muted">Piutang</div><strong id="sDue">Rp0</strong></div><div class="card stat"><div class="muted">Estimasi Laba</div><strong id="sProfit">Rp0</strong></div></div>
<div class="card"><h3>Ringkasan Pesanan</h3><div id="dashOrders"></div></div></section>

<section id="orders" class="hidden"><div class="card"><h2>Pesanan Baru</h2><div class="grid2">
<div><label>Pelanggan</label><input id="ocust" placeholder="Nama pelanggan"></div><div><label>WhatsApp</label><input id="ophone" placeholder="08xxxxxxxxxx"></div><div><label>Status produksi</label><select id="ostatus"><option>Pesanan Baru</option><option>Diproses</option><option>Selesai</option><option>Diambil</option></select></div><div><label>Deadline</label><input id="odeadline" type="date"></div></div><br><div id="oitems"></div><button class="btn secondary no-print" onclick="addOrderItem()">+ Tambah item</button><br><br><div class="grid2"><div><label>DP</label><input id="odp" type="number" value="0"></div><div><label>Catatan</label><textarea id="onote" placeholder="Ukuran, warna, sablon, dll"></textarea></div></div><br><button class="btn primary" onclick="saveOrder()">Simpan Pesanan</button></div>
<div class="card"><h3>Daftar Pesanan</h3><div id="orderList"></div></div></section>

<section id="invoice" class="hidden"><div class="card no-print"><h2>Invoice</h2><label>Pilih pesanan</label><select id="invoiceSelect" onchange="previewInvoice()"></select></div><div id="invoicePaper" class="invoice-paper"></div><div class="actions no-print"><button class="btn primary" onclick="window.print()">Cetak / Simpan PDF</button><button class="btn secondary" onclick="shareInvoice()">Bagikan teks WhatsApp</button></div></section>

<section id="stock" class="hidden"><div class="card"><h2>Stok Bahan & Produk</h2><div class="grid2"><div><label>Nama barang</label><input id="stname" placeholder="Cotton Combed 24s / Plastisol"></div><div><label>Satuan</label><input id="stunit" placeholder="pcs / kg / botol"></div><div><label>Stok</label><input id="stqty" type="number"></div><div><label>Harga modal/unit</label><input id="stcost" type="number"></div></div><br><button class="btn primary" onclick="saveStock()">Tambah / Update</button></div><div class="card" id="stockList"></div></section>

<section id="purchase" class="hidden"><div class="card"><h2>Belanja / Pembelian Bahan</h2><div class="grid2"><div><label>Barang</label><input id="pn"></div><div><label>Supplier</label><input id="ps"></div><div><label>Jumlah</label><input id="pq" type="number"></div><div><label>Total belanja</label><input id="pa" type="number"></div></div><br><button class="btn primary" onclick="savePurchase()">Simpan Pembelian</button></div><div class="card" id="purchaseList"></div></section>

<section id="expense" class="hidden"><div class="card"><h2>Pengeluaran Operasional</h2><div class="grid2"><div><label>Keperluan</label><input id="en"></div><div><label>Nominal</label><input id="ea" type="number"></div></div><br><button class="btn primary" onclick="saveExpense()">Simpan Pengeluaran</button></div><div class="card" id="expenseList"></div></section>

<section id="reports" class="hidden"><div class="card"><h2>Laporan Keuangan</h2><div id="report"></div><hr><button class="btn secondary" onclick="backup()">Backup Data</button> <button class="btn secondary" onclick="restore()">Import Backup</button> <input id="restoreFile" type="file" accept=".json" hidden onchange="doRestore(event)"></div></section>

<section id="settings" class="hidden"><div class="card"><h2>Pengaturan Toko</h2><div class="grid2"><div><label>Nama toko</label><input id="setName"></div><div><label>WhatsApp</label><input id="setWa" placeholder="08xxxxxxxxxx"></div><div><label>Instagram</label><input id="setIg"></div><div><label>Alamat</label><textarea id="setAddr"></textarea></div></div><br><button class="btn primary" onclick="saveSettings()">Simpan Pengaturan</button></div></section>
</div>
<script>
const KEY='bs_pro_v2';let db=JSON.parse(localStorage.getItem(KEY)||'{"orders":[],"stock":[],"purchase":[],"expense":[],"settings":{"name":"BS STREETWEAR CLOTH","wa":"","ig":"@bsstreetwear_cloth","addr":"Jl. Tegalpanas, Jimbaran, Secang, Samban, RT 01/RW 01"}}');
const rp=n=>'Rp'+Number(n||0).toLocaleString('id-ID');function save(){localStorage.setItem(KEY,JSON.stringify(db));render()}function tab(id,b){document.querySelectorAll('section').forEach(s=>s.classList.add('hidden'));document.getElementById(id).classList.remove('hidden');document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('active'));b.classList.add('active');render()}
function addOrderItem(){let d=document.createElement('div');d.className='row oitem';d.innerHTML=`<div class="wide"><label>Produk / Detail</label><input class="on" placeholder="Kaos Cotton Combed 24s + Plastisol"></div><div><label>Qty</label><input class="oq" type="number" value="1"></div><div><label>Harga</label><input class="op" type="number" value="0"></div><div><label>HPP</label><input class="oc" type="number" value="0"></div><button class="btn danger" onclick="this.parentElement.remove()">×</button>`;document.getElementById('oitems').appendChild(d)}
function saveOrder(){let items=[...document.querySelectorAll('.oitem')].map(x=>({name:x.querySelector('.on').value||'Produk',qty:+x.querySelector('.oq').value||0,price:+x.querySelector('.op').value||0,cost:+x.querySelector('.oc').value||0}));if(!items.length)return alert('Tambah item.');let total=items.reduce((s,i)=>s+i.qty*i.price,0),cost=items.reduce((s,i)=>s+i.qty*i.cost,0),dp=+odp.value||0;let id='INV-'+new Date().toISOString().slice(0,10).replaceAll('-','')+'-'+String(db.orders.length+1).padStart(3,'0');db.orders.unshift({id,date:new Date().toLocaleString('id-ID'),cust:ocust.value||'Umum',phone:ophone.value,status:ostatus.value,deadline:odeadline.value,total,cost,dp,note:onote.value,items});save();alert('Tersimpan '+id);document.getElementById('oitems').innerHTML='';addOrderItem()}
function saveStock(){let n=stname.value.trim();if(!n)return;let x=db.stock.find(x=>x.name.toLowerCase()==n.toLowerCase());if(x){x.qty=+stqty.value||0;x.unit=stunit.value;x.cost=+stcost.value||0}else db.stock.push({name:n,qty:+stqty.value||0,unit:stunit.value,cost:+stcost.value||0});stname.value='';stqty.value='';stunit.value='';stcost.value='';save()}
function savePurchase(){let n=pn.value.trim(),a=+pa.value||0,q=+pq.value||0;if(!n||!a)return;db.purchase.unshift({date:new Date().toLocaleString('id-ID'),name:n,supplier:ps.value,qty:q,amount:a});let x=db.stock.find(x=>x.name.toLowerCase()==n.toLowerCase());if(x)x.qty+=q;save()}
function saveExpense(){let n=en.value.trim(),a=+ea.value||0;if(!n||!a)return;db.expense.unshift({date:new Date().toLocaleString('id-ID'),name:n,amount:a});save()}
function previewInvoice(){let x=db.orders.find(x=>x.id==invoiceSelect.value);if(!x)return;invoicePaper.innerHTML=`<div class="invoice-head"><div><h2 style="margin:0">${db.settings.name}</h2><div class="muted">${db.settings.addr}</div><div class="muted">${db.settings.ig} ${db.settings.wa?'• '+db.settings.wa:''}</div></div><div class="right"><b>${x.id}</b><br><span class="muted">${x.date}</span></div></div><p><b>Pelanggan:</b> ${x.cust}<br><b>WhatsApp:</b> ${x.phone||'-'}<br><b>Status:</b> ${x.status}</p><table><tr><th>Item</th><th>Qty</th><th>Harga</th><th>Total</th></tr>${x.items.map(i=>`<tr><td>${i.name}</td><td>${i.qty}</td><td>${rp(i.price)}</td><td>${rp(i.qty*i.price)}</td></tr>`).join('')}</table><div class="right" style="margin-top:16px">Total <b>${rp(x.total)}</b><br>DP <b>${rp(x.dp)}</b><br><span class="total">Sisa ${rp(x.total-x.dp)}</span></div>${x.note?`<p><b>Catatan:</b> ${x.note}</p>`:''}<p class="muted">Terima kasih telah mempercayakan pesanan kepada ${db.settings.name}.</p>`}
function shareInvoice(){let x=db.orders.find(x=>x.id==invoiceSelect.value);if(!x)return;let t=`${db.settings.name}%0AInvoice ${x.id}%0APelanggan: ${x.cust}%0ATotal: ${rp(x.total)}%0ADP: ${rp(x.dp)}%0ASisa: ${rp(x.total-x.dp)}%0AStatus: ${x.status}`;if(x.phone)location.href='https://wa.me/'+x.phone.replace(/^0/,'62')+'?text='+t;else alert('Nomor WhatsApp pelanggan belum diisi.')}
function render(){let omzet=db.orders.reduce((s,x)=>s+x.total,0),paid=db.orders.reduce((s,x)=>s+x.dp,0),out=db.purchase.reduce((s,x)=>s+x.amount,0)+db.expense.reduce((s,x)=>s+x.amount,0),profit=db.orders.reduce((s,x)=>s+x.total-x.cost,0)-out;sOmzet.textContent=rp(omzet);sPaid.textContent=rp(paid);sDue.textContent=rp(omzet-paid);sProfit.textContent=rp(profit);dashOrders.innerHTML=db.orders.slice(0,7).map(x=>`<p><b>${x.id}</b> — ${x.cust} — ${rp(x.total)} — <span class="pill">${x.status}</span></p>`).join('')||'<span class="muted">Belum ada pesanan.</span>';orderList.innerHTML=db.orders.map(x=>`<div style="padding:10px 0;border-bottom:1px solid #eee"><b>${x.id}</b> — ${x.cust} — ${rp(x.total)} — DP ${rp(x.dp)} — Sisa ${rp(x.total-x.dp)} — <span class="pill">${x.status}</span></div>`).join('')||'<span class="muted">Belum ada pesanan.</span>';invoiceSelect.innerHTML=db.orders.map(x=>`<option value="${x.id}">${x.id} — ${x.cust}</option>`).join('');if(db.orders.length)previewInvoice();stockList.innerHTML='<table><tr><th>Barang</th><th>Stok</th><th>Unit</th><th>Modal</th></tr>'+db.stock.map(x=>`<tr><td>${x.name}</td><td>${x.qty}</td><td>${x.unit}</td><td>${rp(x.cost)}</td></tr>`).join('')+'</table>';purchaseList.innerHTML='<table><tr><th>Tanggal</th><th>Barang</th><th>Supplier</th><th>Total</th></tr>'+db.purchase.map(x=>`<tr><td>${x.date}</td><td>${x.name}</td><td>${x.supplier||'-'}</td><td>${rp(x.amount)}</td></tr>`).join('')+'</table>';expenseList.innerHTML='<table><tr><th>Tanggal</th><th>Keperluan</th><th>Nominal</th></tr>'+db.expense.map(x=>`<tr><td>${x.date}</td><td>${x.name}</td><td>${rp(x.amount)}</td></tr>`).join('')+'</table>';report.innerHTML=`<p>Total pesanan: <b>${db.orders.length}</b></p><p>Omzet: <b>${rp(omzet)}</b></p><p>Terbayar: <b>${rp(paid)}</b></p><p>Piutang: <b>${rp(omzet-paid)}</b></p><p>Pembelian + pengeluaran: <b>${rp(out)}</b></p><p>Estimasi laba: <b>${rp(profit)}</b></p>`;setName.value=db.settings.name;setWa.value=db.settings.wa;setIg.value=db.settings.ig;setAddr.value=db.settings.addr}
function saveSettings(){db.settings={name:setName.value||'BS STREETWEAR CLOTH',wa:setWa.value,ig:setIg.value,addr:setAddr.value};save();alert('Pengaturan tersimpan')}
function backup(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(db,null,2)],{type:'application/json'}));a.download='backup-bs-streetwear.json';a.click()}function restore(){restoreFile.click()}function doRestore(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{db=JSON.parse(r.result);save();alert('Backup berhasil diimport')}catch(_){alert('File backup tidak valid')}};r.readAsText(f)}
setInterval(()=>clock.textContent=new Date().toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'}),1000);
addOrderItem();
render();

if(location.hash==='#orders'){
  tab('orders',document.querySelector('.nav button:nth-child(2)'));
}else{
  tab('dashboard',document.querySelector('.nav button:nth-child(1)'));
}
</script></body></html>
