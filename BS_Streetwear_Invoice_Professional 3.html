<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>BS Streetwear Cloth - Pro</title>
<style>
:root{--bg:#f3f4f6;--card:#fff;--ink:#20252d;--muted:#6b7280;--line:#e5e7eb}
*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,sans-serif;background:var(--bg);color:var(--ink)}
header{background:#111;color:#fff;padding:15px 18px;display:flex;justify-content:space-between;align-items:center}
header b{font-size:18px}header small{display:block;color:#aaa;margin-top:3px}.wrap{max-width:1180px;margin:auto;padding:14px}
.nav{display:flex;gap:7px;overflow:auto;margin-bottom:14px}.nav button{white-space:nowrap;border:1px solid var(--line);background:#fff;border-radius:10px;padding:10px 13px}
.nav button.active,.primary{background:#111;color:#fff;border-color:#111}.card{background:#fff;border:1px solid var(--line);border-radius:15px;padding:15px;margin-bottom:13px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.stat strong{font-size:22px;display:block;margin-top:5px}.muted{color:var(--muted);font-size:12px}
label{font-size:12px;color:#555;display:block;margin-bottom:5px}input,select,textarea{width:100%;padding:10px;border:1px solid #d8dce1;border-radius:9px;font:inherit}textarea{min-height:70px}
.row{display:grid;grid-template-columns:2fr .7fr 1fr 1fr auto;gap:7px;align-items:end;margin-bottom:8px}.actions{display:flex;gap:7px;flex-wrap:wrap}
.btn{border:0;border-radius:9px;padding:10px 13px;cursor:pointer}.danger{background:#b42318;color:#fff}.secondary{background:#eee;color:#222}
table{width:100%;border-collapse:collapse}th,td{padding:9px;border-bottom:1px solid #eee;text-align:left;font-size:13px}th{background:#fafafa}.right{text-align:right}
.total{font-size:21px;font-weight:700}.pill{display:inline-block;padding:4px 8px;border-radius:99px;background:#eee;font-size:11px}.hidden{display:none}
.invoice-wrap{background:#eee;padding:12px 0}.invoice-paper{width:min(210mm,100%);min-height:297mm;margin:auto;background:#fff;padding:18mm 14mm 14mm;box-shadow:0 2px 15px #bbb;color:#20252d}
.invoice-paper .topline{height:4px;background:#45484d;margin-bottom:12px}.invoice-header{display:grid;grid-template-columns:105px 1fr 125px;gap:22px;align-items:start}
.brandbox{height:78px;border:2px solid #444;border-radius:5px;display:flex;align-items:center;justify-content:center;text-align:center;font-weight:700;font-size:12px;line-height:1.1}
.invoice-paper h1{font-size:19px;margin:3px 0 8px}.company{font-size:9px;line-height:1.55;color:#666}.meta{font-size:10px}.meta b{display:block;font-size:9px;margin-bottom:4px}.meta .value{margin-bottom:14px;color:#555}
.invoice-paper hr{border:0;border-top:1px solid #ddd;margin:22px 0 12px}.label{font-size:9px;color:#777;margin-bottom:5px}.customer-row{font-size:13px;margin-bottom:16px;display:flex;align-items:center;gap:10px}
.customer-icon{display:inline-flex;width:30px;height:30px;align-items:center;justify-content:center;border:1.5px solid #444;border-radius:6px;flex:none}
.invoice-table{width:100%;border-collapse:collapse;font-size:10px}.invoice-table th{background:#4c4d4f;color:#fff;padding:7px 6px;text-align:left;font-size:8px}.invoice-table th:nth-child(n+3),.invoice-table td:nth-child(n+3){text-align:right}.invoice-table td{padding:7px 6px;border-bottom:1px solid #eee}
.summary{margin:10px 0 18px auto;width:46%;font-size:10px}.sumrow{display:flex;justify-content:space-between;padding:7px 8px}.sumrow.total{font-weight:700}.sumrow.due{background:#f0f0f0;font-weight:700}
.payment{border:1px solid #bbb;border-radius:6px;padding:12px 14px;margin-bottom:12px}.payment h3{text-align:center;font-size:10px;margin:0 0 12px}.banks{display:grid;grid-template-columns:1fr 1fr}.bank{padding:0 12px;font-size:9px;line-height:1.65}.bank+.bank{border-left:1px solid #bbb}.bankname{font-weight:700;font-size:10px;margin-bottom:4px;display:flex;align-items:center;gap:10px}.banklogo{width:92px;max-height:38px;object-fit:contain}.mandirilogo{width:105px}
.note{background:#f1f1f1;border-left:5px solid #4c4d4f;padding:9px 10px;font-size:8px;line-height:1.6;margin-bottom:14px}.note b{font-size:9px}
.contacts{border-top:1px solid #ccc;border-bottom:1px solid #ccc;padding:9px 0;display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;font-size:8px;align-items:center}.contact{display:flex;align-items:center;gap:7px}.icon,.icon svg{width:20px;height:20px;flex:none}.icon svg{fill:#111}
.thanks{text-align:center;font-size:8px;color:#777;font-style:italic;margin-top:12px}.invoice-actions{display:flex;gap:10px;justify-content:center;margin:22px 0 4px;flex-wrap:wrap}.footer{display:flex;justify-content:space-between;color:#999;font-size:7px;margin-top:32px}
@media(max-width:760px){.grid{grid-template-columns:1fr 1fr}.grid2{grid-template-columns:1fr}.row{grid-template-columns:1fr 1fr}.row .wide{grid-column:1/-1}.invoice-paper{padding:20px 14px}.invoice-header{grid-template-columns:76px minmax(0,1fr) 76px;gap:10px}.brandbox{height:65px;font-size:9px}.invoice-paper h1{font-size:15px;white-space:nowrap}.company{font-size:7.5px}.meta{font-size:8px}.meta b{font-size:8px}.meta .value{margin-bottom:10px}.summary{width:60%}.payment{padding:12px 8px}.bank{padding:0 5px;font-size:8px}.bankname{font-size:8px}.contacts{font-size:7px}.contact{gap:4px}}
@media(max-width:450px){.grid{grid-template-columns:1fr}.wrap{padding:9px}}
@media print{header,.nav,.no-print{display:none!important}body{background:#fff}.wrap{padding:0}.invoice-wrap{padding:0;background:#fff}.invoice-paper{margin:0!important;width:210mm!important;height:297mm!important;min-height:297mm!important;box-shadow:none!important;padding:18mm 14mm 14mm!important;overflow:hidden!important}@page{size:A4 portrait;margin:0}}
</style>
</head>
<body>
<header><div><b>BS STREETWEAR CLOTH</b><small>Invoice • Produksi • Stok • Keuangan</small></div><span id="clock"></span></header>
<div class="wrap">
<div class="nav no-print">
<button class="active" onclick="tab('dashboard',this)">Dashboard</button><button onclick="tab('orders',this)">Pesanan</button><button onclick="tab('invoice',this)">Invoice</button><button onclick="tab('stock',this)">Stok</button><button onclick="tab('purchase',this)">Belanja</button><button onclick="tab('expense',this)">Pengeluaran</button><button onclick="tab('reports',this)">Laporan</button><button onclick="tab('settings',this)">Pengaturan</button>
</div>
<section id="dashboard"><div class="grid"><div class="card stat"><div class="muted">Omzet</div><strong id="sOmzet">Rp0</strong></div><div class="card stat"><div class="muted">Terbayar</div><strong id="sPaid">Rp0</strong></div><div class="card stat"><div class="muted">Piutang</div><strong id="sDue">Rp0</strong></div><div class="card stat"><div class="muted">Estimasi Laba</div><strong id="sProfit">Rp0</strong></div></div><div class="card"><h3>Ringkasan Pesanan</h3><div id="dashOrders"></div></div></section>
<section id="orders" class="hidden"><div class="card"><h2>Pesanan Baru</h2><div class="grid2"><div><label>Pelanggan</label><input id="ocust" placeholder="Nama pelanggan"></div><div><label>WhatsApp</label><input id="ophone" placeholder="08xxxxxxxxxx"></div><div><label>Status produksi</label><select id="ostatus"><option>Pesanan Baru</option><option>Diproses</option><option>Selesai</option><option>Diambil</option></select></div><div><label>Deadline</label><input id="odeadline" type="date"></div></div><br><div id="oitems"></div><button class="btn secondary no-print" onclick="addOrderItem()">+ Tambah item</button><br><br><div class="grid2"><div><label>DP</label><input id="odp" type="number" value="0"></div><div><label>Catatan</label><textarea id="onote" placeholder="Ukuran, warna, sablon, dll"></textarea></div></div><br><button class="btn primary" onclick="saveOrder()">Simpan Pesanan</button></div><div class="card"><h3>Daftar Pesanan</h3><div id="orderList"></div></div></section>
<section id="invoice" class="hidden"><div class="card no-print"><h2>Invoice</h2><label>Pilih pesanan</label><select id="invoiceSelect" onchange="previewInvoice()"></select></div><div class="invoice-wrap"><div id="invoicePaper" class="invoice-paper"></div></div><div class="actions no-print" style="justify-content:center"><button class="btn primary" onclick="window.print()">Cetak / Simpan PDF</button><button class="btn secondary" onclick="shareInvoice()">Bagikan teks WhatsApp</button></div></section>
<section id="stock" class="hidden"><div class="card"><h2>Stok Bahan & Produk</h2><div class="grid2"><div><label>Nama barang</label><input id="stname" placeholder="Cotton Combed 24s / Plastisol"></div><div><label>Satuan</label><input id="stunit" placeholder="pcs / kg / botol"></div><div><label>Stok</label><input id="stqty" type="number"></div><div><label>Harga modal/unit</label><input id="stcost" type="number"></div></div><br><button class="btn primary" onclick="saveStock()">Tambah / Update</button></div><div class="card" id="stockList"></div></section>
<section id="purchase" class="hidden"><div class="card"><h2>Belanja / Pembelian Bahan</h2><div class="grid2"><div><label>Barang</label><input id="pn"></div><div><label>Supplier</label><input id="ps"></div><div><label>Jumlah</label><input id="pq" type="number"></div><div><label>Total belanja</label><input id="pa" type="number"></div></div><br><button class="btn primary" onclick="savePurchase()">Simpan Pembelian</button></div><div class="card" id="purchaseList"></div></section>
<section id="expense" class="hidden"><div class="card"><h2>Pengeluaran Operasional</h2><div class="grid2"><div><label>Keperluan</label><input id="en"></div><div><label>Nominal</label><input id="ea" type="number"></div></div><br><button class="btn primary" onclick="saveExpense()">Simpan Pengeluaran</button></div><div class="card" id="expenseList"></div></section>
<section id="reports" class="hidden"><div class="card"><h2>Laporan Keuangan</h2><div id="report"></div><hr><button class="btn secondary" onclick="backup()">Backup Data</button> <button class="btn secondary" onclick="restore()">Import Backup</button> <input id="restoreFile" type="file" accept=".json" hidden onchange="doRestore(event)"></div></section>
<section id="settings" class="hidden"><div class="card"><h2>Pengaturan Toko</h2><div class="grid2"><div><label>Nama toko</label><input id="setName"></div><div><label>WhatsApp</label><input id="setWa" placeholder="08xxxxxxxxxx"></div><div><label>Instagram</label><input id="setIg"></div><div><label>Alamat</label><textarea id="setAddr"></textarea></div></div><br><button class="btn primary" onclick="saveSettings()">Simpan Pengaturan</button></div></section>
</div>
<script>
const KEY='bs_pro_v2';let db=JSON.parse(localStorage.getItem(KEY)||'{"orders":[],"stock":[],"purchase":[],"expense":[],"settings":{"name":"BS STREETWEAR CLOTH","wa":"","ig":"@bsstreetwear_cloth","addr":"Jalan Jimbaran Telagapanas, Samban, Kabupaten Semarang, Jawa Tengah, Indonesia"}}');
const rp=n=>'Rp'+Number(n||0).toLocaleString('id-ID');function save(){localStorage.setItem(KEY,JSON.stringify(db));render()}
function tab(id,b){document.querySelectorAll('section').forEach(s=>s.classList.add('hidden'));document.getElementById(id).classList.remove('hidden');document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('active'));b.classList.add('active');render()}
function addOrderItem(){let d=document.createElement('div');d.className='row oitem';d.innerHTML=`<div class="wide"><label>Produk / Detail</label><input class="on" placeholder="Kaos Cotton Combed 24s + Plastisol"></div><div><label>Qty</label><input class="oq" type="number" value="1"></div><div><label>Harga</label><input class="op" type="number" value="0"></div><div><label>HPP</label><input class="oc" type="number" value="0"></div><button class="btn danger" onclick="this.parentElement.remove()">×</button>`;document.getElementById('oitems').appendChild(d)}
function saveOrder(){let items=[...document.querySelectorAll('.oitem')].map(x=>({name:x.querySelector('.on').value||'Produk',qty:+x.querySelector('.oq').value||0,price:+x.querySelector('.op').value||0,cost:+x.querySelector('.oc').value||0}));if(!items.length)return alert('Tambah item.');let total=items.reduce((s,i)=>s+i.qty*i.price,0),cost=items.reduce((s,i)=>s+i.qty*i.cost,0),dp=+odp.value||0;let id='INV-'+new Date().toISOString().slice(0,10).replaceAll('-','')+'-'+String(db.orders.length+1).padStart(3,'0');db.orders.unshift({id,date:new Date().toLocaleString('id-ID'),cust:ocust.value||'Umum',phone:ophone.value,status:ostatus.value,deadline:odeadline.value,total,cost,dp,note:onote.value,items});save();alert('Tersimpan '+id);document.getElementById('oitems').innerHTML='';addOrderItem()}
function saveStock(){let n=stname.value.trim();if(!n)return;let x=db.stock.find(x=>x.name.toLowerCase()==n.toLowerCase());if(x){x.qty=+stqty.value||0;x.unit=stunit.value;x.cost=+stcost.value||0}else db.stock.push({name:n,qty:+stqty.value||0,unit:stunit.value,cost:+stcost.value||0});stname.value='';stqty.value='';stunit.value='';stcost.value='';save()}
function savePurchase(){let n=pn.value.trim(),a=+pa.value||0,q=+pq.value||0;if(!n||!a)return;db.purchase.unshift({date:new Date().toLocaleString('id-ID'),name:n,supplier:ps.value,qty:q,amount:a});let x=db.stock.find(x=>x.name.toLowerCase()==n.toLowerCase());if(x)x.qty+=q;save()}
function saveExpense(){let n=en.value.trim(),a=+ea.value||0;if(!n||!a)return;db.expense.unshift({date:new Date().toLocaleString('id-ID'),name:n,amount:a});save()}
function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function previewInvoice(){let x=db.orders.find(x=>x.id==invoiceSelect.value);if(!x)return;let s=db.settings||{},date=x.date||new Date().toLocaleDateString('id-ID'),items=x.items||[];invoicePaper.innerHTML=`
<div class="topline"></div>
<section class="invoice-header"><div class="brandbox">BS<br>STREETWEAR<br>CLOTH</div><div><h1>BS STREETWEAR CLOTH</h1><div class="company">${esc(s.addr||'Jalan Jimbaran Telagapanas, Samban, Kabupaten Semarang, Jawa Tengah, Indonesia')}<br>WhatsApp: ${esc(s.wa||'85728122348')}<br>arghaniriawan@gmail.com</div></div><div class="meta"><b>FAKTUR</b><div class="value">${esc(x.id)}</div><b>TANGGAL</b><div class="value">${esc(date)}</div></div></section>
<hr><div class="label">UNTUK</div><div class="customer-row"><span class="customer-icon"><svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="#222" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8h12l1 12H5L6 8z"></path><path d="M9 8a3 3 0 0 1 6 0"></path></svg></span><span>${esc(x.cust||'Umum')}</span></div>
<table class="invoice-table"><thead><tr><th>DESKRIPSI</th><th>UKURAN</th><th>HARGA SATUAN</th><th>QTY</th><th>TOTAL</th></tr></thead><tbody>${items.map(i=>`<tr><td>${esc(i.name||'Produk')}</td><td>${esc(i.size||'')}</td><td>${rp(i.price)}</td><td>${i.qty||0}</td><td>${rp((i.qty||0)*(i.price||0))}</td></tr>`).join('')||'<tr><td colspan="5" style="text-align:center;color:#999">Belum ada item</td></tr>'}</tbody></table>
<div class="summary"><div class="sumrow total"><span>TOTAL</span><span>${rp(x.total)}</span></div><div class="sumrow"><span>DP / PEMBAYARAN</span><span>${rp(x.dp)}</span></div><div class="sumrow due"><span>TOTAL KEKURANGAN</span><span>${rp(x.total-x.dp)}</span></div></div>
<section class="payment"><h3>METODE PEMBAYARAN</h3><div class="banks"><div class="bank"><div class="bankname"><img class="banklogo" src="https://www.bca.co.id/-/media/Feature/Card/List-Card/Tentang-BCA/Brand-Assets/Logo-BCA/Logo-BCA_Biru.png" alt="BCA"><span>Bank Central Asia (BCA)</span></div>Nama Rekening: Randirawan<br>No Rek: 3201-1621-39</div><div class="bank"><div class="bankname"><img class="banklogo mandirilogo" src="https://upload.wikimedia.org/wikipedia/commons/a/ad/Bank_Mandiri_logo_2016.svg" alt="Bank Mandiri"><span>Bank Mandiri</span></div>Nama Rekening: Randirawan<br>No Rek: 136-00-1927498-1</div></div></section>
<div class="note"><b>CATATAN PESANAN</b><br>• Pesanan diproses setelah pembayaran/DP diterima.<br>• Pelunasan dilakukan sebelum pengambilan/pengiriman.</div>
<div class="contacts"><div class="contact"><span class="icon"><svg viewBox="0 0 24 24"><path d="M7 2h10a5 5 0 0 1 5 5v10a5 5 0 0 1-5 5H7a5 5 0 0 1-5-5V7a5 5 0 0 1 5-5zm0 2a3 3 0 0 0-3 3v10a3 3 0 0 0 3 3h10a3 3 0 0 0 3-3V7a3 3 0 0 0-3-3H7zm5 3.5A4.5 4.5 0 1 1 12 16.5 4.5 4.5 0 0 1 12 7.5zm0 2A2.5 2.5 0 1 0 12 14.5 2.5 2.5 0 0 0 12 9.5zM17.7 6.3a1.1 1.1 0 1 1 0 2.2 1.1 1.1 0 0 1 0-2.2z"/></svg></span><span>@bsstreetwear_cloth</span></div><div class="contact"><span class="icon"><svg viewBox="0 0 24 24"><path d="M14 3h3.1c.3 1.7 1.3 3.1 2.9 4v3.1c-1.4-.1-2.7-.5-3.9-1.2v6.2A5.9 5.9 0 1 1 10.2 9v3.2a2.8 2.8 0 1 0 2.8 2.8V3H14z"/></svg></span><span>BS Streetwear Cloth</span></div><div class="contact"><span class="icon"><svg viewBox="0 0 24 24"><path d="M12 2a7 7 0 0 0-7 7c0 5.1 7 13 7 13s7-7.9 7-13a7 7 0 0 0-7-7zm0 9.5A2.5 2.5 0 1 1 12 6a2.5 2.5 0 0 1 0 5.5z"/></svg></span><span>Semarang, Jawa Tengah</span></div></div>
<div class="thanks">Terima kasih telah mempercayakan pesanan Anda kepada BS Streetwear Cloth.</div>
<div class="invoice-actions no-print"><button type="button" class="btn primary" onclick="goOrders()">🛒 BELI / BUAT PESANAN</button><button type="button" class="btn secondary" onclick="goHome()">🏠 KEMBALI KE MENU AWAL</button></div>
<div class="footer"><span>BS Streetwear Cloth — Invoice</span><span>Halaman 1</span></div>`}
function shareInvoice(){let x=db.orders.find(x=>x.id==invoiceSelect.value);if(!x)return;let t=`${db.settings.name}%0AInvoice ${x.id}%0APelanggan: ${x.cust}%0ATotal: ${rp(x.total)}%0ADP: ${rp(x.dp)}%0ASisa: ${rp(x.total-x.dp)}%0AStatus: ${x.status}`;if(x.phone)location.href='https://wa.me/'+x.phone.replace(/^0/,'62')+'?text='+t;else alert('Nomor WhatsApp pelanggan belum diisi.')}
function goOrders(){location.hash='orders';tab('orders',document.querySelector('.nav button:nth-child(2)'))}
function goHome(){location.hash='dashboard';tab('dashboard',document.querySelector('.nav button:nth-child(1)'))}
function render(){let omzet=db.orders.reduce((s,x)=>s+x.total,0),paid=db.orders.reduce((s,x)=>s+x.dp,0),out=db.purchase.reduce((s,x)=>s+x.amount,0)+db.expense.reduce((s,x)=>s+x.amount,0),profit=db.orders.reduce((s,x)=>s+x.total-x.cost,0)-out;sOmzet.textContent=rp(omzet);sPaid.textContent=rp(paid);sDue.textContent=rp(omzet-paid);sProfit.textContent=rp(profit);dashOrders.innerHTML=db.orders.slice(0,7).map(x=>`<p><b>${esc(x.id)}</b> — ${esc(x.cust)} — ${rp(x.total)} — <span class="pill">${esc(x.status)}</span></p>`).join('')||'<span class="muted">Belum ada pesanan.</span>';orderList.innerHTML=db.orders.map(x=>`<div style="padding:10px 0;border-bottom:1px solid #eee"><b>${esc(x.id)}</b> — ${esc(x.cust)} — ${rp(x.total)} — DP ${rp(x.dp)} — Sisa ${rp(x.total-x.dp)} — <span class="pill">${esc(x.status)}</span></div>`).join('')||'<span class="muted">Belum ada pesanan.</span>';invoiceSelect.innerHTML=db.orders.map(x=>`<option value="${esc(x.id)}">${esc(x.id)} — ${esc(x.cust)}</option>`).join('');if(db.orders.length)previewInvoice();stockList.innerHTML='<table><tr><th>Barang</th><th>Stok</th><th>Unit</th><th>Modal</th></tr>'+db.stock.map(x=>`<tr><td>${esc(x.name)}</td><td>${x.qty}</td><td>${esc(x.unit)}</td><td>${rp(x.cost)}</td></tr>`).join('')+'</table>';purchaseList.innerHTML='<table><tr><th>Tanggal</th><th>Barang</th><th>Supplier</th><th>Total</th></tr>'+db.purchase.map(x=>`<tr><td>${esc(x.date)}</td><td>${esc(x.name)}</td><td>${esc(x.supplier||'-')}</td><td>${rp(x.amount)}</td></tr>`).join('')+'</table>';expenseList.innerHTML='<table><tr><th>Tanggal</th><th>Keperluan</th><th>Nominal</th></tr>'+db.expense.map(x=>`<tr><td>${esc(x.date)}</td><td>${esc(x.name)}</td><td>${rp(x.amount)}</td></tr>`).join('')+'</table>';report.innerHTML=`<p>Total pesanan: <b>${db.orders.length}</b></p><p>Omzet: <b>${rp(omzet)}</b></p><p>Terbayar: <b>${rp(paid)}</b></p><p>Piutang: <b>${rp(omzet-paid)}</b></p><p>Pembelian + pengeluaran: <b>${rp(out)}</b></p><p>Estimasi laba: <b>${rp(profit)}</b></p>`;setName.value=db.settings.name;setWa.value=db.settings.wa;setIg.value=db.settings.ig;setAddr.value=db.settings.addr}
function saveSettings(){db.settings={name:setName.value||'BS STREETWEAR CLOTH',wa:setWa.value,ig:setIg.value,addr:setAddr.value};save();alert('Pengaturan tersimpan')}
function backup(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(db,null,2)],{type:'application/json'}));a.download='backup-bs-streetwear.json';a.click()}
function restore(){restoreFile.click()}function doRestore(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{db=JSON.parse(r.result);save();alert('Backup berhasil diimport')}catch(_){alert('File backup tidak valid')}};r.readAsText(f)}
setInterval(()=>clock.textContent=new Date().toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'}),1000);addOrderItem();render();
if(location.hash==='#orders')setTimeout(()=>tab('orders',document.querySelector('.nav button:nth-child(2)')),100);
else if(location.hash==='#dashboard')setTimeout(()=>tab('dashboard',document.querySelector('.nav button:nth-child(1)')),100);
</script>
</body></html>
